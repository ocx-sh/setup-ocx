name: "Setup OCX"
description: "Install the OCX package manager and (optionally) activate an OCX project from ocx.toml + ocx.lock"
author: "ocx-sh"
branding:
  icon: "package"
  color: "blue"
inputs:
  version:
    description: 'OCX version to install (e.g., "latest", "0.2.0")'
    required: false
    default: "latest"
  github-token:
    description: "GitHub token for API requests and release downloads"
    required: false
    default: "${{ github.token }}"
  libc:
    description: 'Linux C library variant ("gnu" or "musl"). Auto-detected if not specified.'
    required: false
    default: ""
  project:
    description: "Path to the project ocx.toml (relative to working-directory). Set to an empty string to disable project auto-load. When the file exists, the action runs `ocx pull` and activates the project so subsequent steps can invoke the bound tools directly."
    required: false
    default: "ocx.toml"
  working-directory:
    description: "Directory used to resolve `project` and to invoke ocx. Defaults to the workflow workspace."
    required: false
    default: ${{ github.workspace }}
  groups:
    description: "Comma-separated list of project groups to pre-warm via `ocx pull -g`. Empty (default) pulls every entry from ocx.lock."
    required: false
    default: ""
  cache:
    description: "Cache the OCX object store ($OCX_HOME/{blobs,layers,packages,tags}) across runs via @actions/cache, keyed on a hash of ocx.lock. Also caches the ocx binary itself."
    required: false
    default: "true"
  cache-suffix:
    description: "Extra string appended to cache keys for manual cache busting."
    required: false
    default: ""
  ocx-home:
    description: "Overrides $OCX_HOME. Defaults to ~/.ocx."
    required: false
    default: ""
outputs:
  version:
    description: "The installed OCX version"
  ocx-path:
    description: "Path to the OCX binary directory"
  cache-hit:
    description: "Whether the OCX binary was restored from cache"
  project-loaded:
    description: 'Whether an OCX project was found and activated (`"true"` / `"false"`)'
  project-cache-hit:
    description: "Whether the OCX object store was restored from the cache for this project"
runs:
  using: node24
  main: dist/setup/index.js
  post: dist/save-cache/index.js
  post-if: success()
