# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

env:
  OCX_INDEX: '{{.ROOT_DIR}}/.ocx'

vars:
  OCX_NODE_VERSION: '24'
  OCX_BUN_VERSION: '1.3'
  OCX_EXEC: 'ocx exec nodejs:{{.OCX_NODE_VERSION}} bun:{{.OCX_BUN_VERSION}} --'

tasks:
  update:ocx-tools:
    desc: Update OCX index
    cmds:
      - rm -rf {{.OCX_INDEX}}
      - ocx index update nodejs:{{.OCX_NODE_VERSION}} bun:{{.OCX_BUN_VERSION}}
  update:bun-packages:
    desc: Update package versions in package.json
    cmd: '{{.OCX_EXEC}} bun update --latest'
  update:
    desc: Update OCX index and package versions
    cmds:
      - task: update:ocx-tools
      - task: update:bun-packages

  build:
    desc: Build the dist bundle
    cmd: '{{.OCX_EXEC}} bun run build'

  test:
    desc: Run unit tests
    cmd: '{{.OCX_EXEC}} bun test'

  test:watch:
    desc: Run unit tests in watch mode
    cmd: '{{.OCX_EXEC}} bun test --watch'

  check:
    desc: Run all checks (test, build, dist freshness)
    cmds:
      - task: test
      - task: build
      - task: dist:check

  dist:check:
    desc: Verify dist is up to date with source
    cmd: git diff --exit-code dist/

  install:
    desc: Install dependencies
    cmd: '{{.OCX_EXEC}} bun install'
