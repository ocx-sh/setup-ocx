# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

env:
  OCX_INDEX: '{{.ROOT_DIR}}/.ocx'

vars:
  OCX_NODE_VERSION: '24'
  OCX_BUN_VERSION: '1.3'
  OCX_GIT_CLIFF_VERSION: '2.12'
  OCX_EXEC: 'ocx exec nodejs:{{.OCX_NODE_VERSION}} bun:{{.OCX_BUN_VERSION}} git-cliff:{{.OCX_GIT_CLIFF_VERSION}} --'

tasks:
  update:ocx-tools:
    desc: Update OCX index
    cmds:
      - rm -rf {{.OCX_INDEX}}
      - ocx index update nodejs:{{.OCX_NODE_VERSION}} bun:{{.OCX_BUN_VERSION}} git-cliff:{{.OCX_GIT_CLIFF_VERSION}}
  update:bun-packages:
    desc: Update package versions in package.json
    cmd: '{{.OCX_EXEC}} bun update --latest'
  update:
    desc: Update OCX index and package versions
    cmds:
      - task: update:ocx-tools
      - task: update:bun-packages

  build:
    desc: Build the dist bundle
    cmd: '{{.OCX_EXEC}} bun run build'

  test:
    desc: Run unit tests
    cmd: '{{.OCX_EXEC}} bun test'

  test:watch:
    desc: Run unit tests in watch mode
    cmd: '{{.OCX_EXEC}} bun test --watch'

  check:
    desc: Run all checks (test, build, dist freshness)
    cmds:
      - task: test
      - task: build
      - task: dist:check

  dist:check:
    desc: Verify dist is up to date with source
    cmd: git diff --exit-code dist/

  install:
    desc: Install dependencies
    cmd: '{{.OCX_EXEC}} bun install'

  lint:sh:
    desc: ShellCheck the POSIX installer + helper scripts
    cmds:
      - shellcheck sh/install.sh
      - shellcheck gitlab/entrypoint.sh
      - shellcheck scripts/build-gitlab-export.sh scripts/publish-installers.sh

  lint:ps1:
    desc: Run PSScriptAnalyzer over the PowerShell installer
    cmd: pwsh -NoProfile -Command 'Invoke-ScriptAnalyzer -Path pwsh/install.ps1 -Severity Warning,Error -EnableExit'

  test:install:sh:
    desc: Run Bats tests against fixture HTTP server (env knobs, exit codes)
    cmd: bats tests/install/env-knobs.bats

  test:install:ps1:
    desc: Run Pester tests against fixture HTTP server (Windows / pwsh)
    cmd: |
      pwsh -NoProfile -Command '
        Import-Module Pester
        $cfg = New-PesterConfiguration
        $cfg.Run.Path = "tests/install/ps1"
        Invoke-Pester -Configuration $cfg
      '

  sync:gitlab:
    desc: Copy sh/install.sh into gitlab/install.sh (drift-checked in CI)
    cmds:
      - cp sh/install.sh gitlab/install.sh
      - chmod +x gitlab/install.sh
      - diff -q sh/install.sh gitlab/install.sh

  publish:installers:dry-run:
    desc: Dry-run publish installers (validates rsync flags + paths)
    vars:
      VERSION:
        sh: '{{.OCX_EXEC}} git-cliff --bumped-version 2>/dev/null | sed "s/^v//" || echo "0.0.0-dev"'
    cmds:
      - DRY_RUN=1 VERSION={{.VERSION}} SSH_KEY=/dev/null scripts/publish-installers.sh || true

  release:
    desc: Generate CHANGELOG.md and create a version tag
    preconditions:
      - sh: git diff --quiet && git diff --cached --quiet
        msg: Working tree must be clean
    vars:
      VERSION:
        sh: '{{.OCX_EXEC}} git-cliff --bumped-version'
    cmds:
      - '{{.OCX_EXEC}} git-cliff --bump --output CHANGELOG.md'
      - 'git add CHANGELOG.md'
      - 'git commit -m "release: {{.VERSION}}"'
      - 'git tag {{.VERSION}}'
      - |
        echo ""
        echo "Release prepared ({{.VERSION}}). Review changes, then:"
        echo "  git push origin main"
        echo "  git push origin {{.VERSION}}"
