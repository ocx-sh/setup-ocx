# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

# Tool versions live in ocx.toml. Locally direnv supplies PATH via .envrc;
# in CI ocx-sh/setup-ocx supplies PATH. Tasks call binaries directly.

tasks:
  update:lock:
    desc: Re-resolve tool tags and rewrite ocx.lock
    cmd: ocx lock

  update:bun-packages:
    desc: Update package versions in package.json
    cmd: bun update --latest

  update:
    desc: Update OCX lock and package versions
    cmds:
      - task: update:lock
      - task: update:bun-packages

  build:
    desc: Build the dist bundle
    cmd: bun run build

  test:
    desc: Run unit tests
    cmd: bun test

  test:watch:
    desc: Run unit tests in watch mode
    cmd: bun test --watch

  check:
    desc: Run all checks (test, build, dist freshness)
    cmds:
      - task: test
      - task: build
      - task: dist:check

  dist:check:
    desc: Verify dist is up to date with source
    cmd: git diff --exit-code dist/

  install:
    desc: Install dependencies
    cmd: bun install

  release:
    desc: Generate CHANGELOG.md and create a version tag
    preconditions:
      - sh: git diff --quiet && git diff --cached --quiet
        msg: Working tree must be clean
    vars:
      VERSION:
        sh: 'git-cliff --bumped-version'
    cmds:
      - 'git-cliff --bump --output CHANGELOG.md'
      - 'git add CHANGELOG.md'
      - 'git commit -m "release: {{.VERSION}}"'
      - 'git tag {{.VERSION}}'
      - |
        echo ""
        echo "Release prepared ({{.VERSION}}). Review changes, then:"
        echo "  git push origin main"
        echo "  git push origin {{.VERSION}}"
