name: Verify Basic

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dogfood:
    name: Dogfood
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup OCX
        id: setup
        uses: ./
      - name: Verify toolchain activation
        run: |
          bun --version
          node --version
          task --version
          git-cliff --version
          ocx version
      - run: task install
      - run: task check
      - name: Verify outputs
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          OCX_PATH: ${{ steps.setup.outputs.ocx-path }}
          TC_LOADED: ${{ steps.setup.outputs.toolchain-loaded }}
        run: |
          test -n "$VERSION"
          test -n "$OCX_PATH"
          test "$TC_LOADED" = "true"

  toolchain-disabled:
    name: Toolchain disabled (binary-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup OCX (binary only)
        id: setup
        uses: ./
        with:
          toolchain: ""
      - name: Verify ocx works but toolchain is not activated
        env:
          TC_LOADED: ${{ steps.setup.outputs.toolchain-loaded }}
        run: |
          ocx version
          test "$TC_LOADED" = "false"
          if command -v bun >/dev/null 2>&1; then
            echo "bun unexpectedly on PATH"
            exit 1
          fi

  integration-musl:
    name: Integration (musl)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup OCX
        id: setup
        uses: ./
        with:
          libc: musl
      - run: bun --version
      - run: node --version
      - name: Verify outputs
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          OCX_PATH: ${{ steps.setup.outputs.ocx-path }}
          TC_LOADED: ${{ steps.setup.outputs.toolchain-loaded }}
        run: |
          test -n "$VERSION"
          test -n "$OCX_PATH"
          test "$TC_LOADED" = "true"

  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup OCX
        uses: ./
      - run: task install
      - run: task fmt:check
      - run: task lint

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup OCX
        uses: ./
      - run: task install
      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
