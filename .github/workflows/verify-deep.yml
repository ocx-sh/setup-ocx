name: Verify Deep

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  warm:
    name: Warm (${{ matrix.os }}${{ matrix.libc && format(' {0}', matrix.libc) || '' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            libc: musl
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup OCX (first install — populates caches in post step)
        id: setup
        uses: ./
        with:
          version: latest
          libc: ${{ matrix.libc || '' }}
          # Per-run cache namespace so warm + verify-cache-hit share a key
          # that nothing else in the GHA cache can collide with. Without this
          # the assertion job could falsely "hit" a cache entry saved by an
          # unrelated workflow run.
          cache-suffix: ${{ github.run_id }}
      - name: Verify binary
        shell: bash
        run: ocx version
      - name: Verify project activation
        shell: bash
        run: |
          bun --version
          node --version
      - name: Print outputs
        shell: bash
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          OCX_PATH: ${{ steps.setup.outputs.ocx-path }}
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          PROJECT_LOADED: ${{ steps.setup.outputs.project-loaded }}
          PROJECT_CACHE_HIT: ${{ steps.setup.outputs.project-cache-hit }}
        run: |
          echo "version=$VERSION"
          echo "ocx-path=$OCX_PATH"
          echo "cache-hit=$CACHE_HIT"
          echo "project-loaded=$PROJECT_LOADED"
          echo "project-cache-hit=$PROJECT_CACHE_HIT"
          test -n "$VERSION"
          test -n "$OCX_PATH"
          test "$PROJECT_LOADED" = "true"

  verify-cache-hit:
    name: Verify cache hit (${{ matrix.os }}${{ matrix.libc && format(' {0}', matrix.libc) || '' }})
    needs: warm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            libc: musl
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup OCX (second install — must hit cache saved by warm job)
        id: setup
        uses: ./
        with:
          version: latest
          libc: ${{ matrix.libc || '' }}
          # Suffix forces a fresh cache namespace per workflow run so this
          # job exercises only the cache that the upstream `warm` job
          # populated, not entries surviving from previous workflow runs.
          # Must match the suffix used by the `warm` job above.
          cache-suffix: ${{ github.run_id }}
      - name: Assert binary cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit=$CACHE_HIT"
          test "$CACHE_HIT" = "true"
      - name: Assert project cache hit
        shell: bash
        env:
          PROJECT_CACHE_HIT: ${{ steps.setup.outputs.project-cache-hit }}
        run: |
          echo "project-cache-hit=$PROJECT_CACHE_HIT"
          test "$PROJECT_CACHE_HIT" = "true"
      - name: Verify project still activates from restored store
        shell: bash
        run: |
          bun --version
          node --version

  # Regression guard for the libuv `process_title` abort on Windows. Affected
  # runtimes (libuv < 1.52.1) crash any Node process that reads an empty console
  # title — including this action's post step, inside @actions/cache's save path.
  # The abort is C-level and uncatchable from JS, so the guard preempts it by
  # setting a non-empty process.title before the cache runs. The assertion here
  # is implicit: if the post step aborts, the *job* goes red. A green job (which
  # DOES run the cache save) proves the workaround holds. Runs on Windows arm64
  # (newest image, where it was first observed) but the bug is not arch-specific.
  verify-windows-arm:
    name: Verify windows-arm64 post step does not abort
    runs-on: windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup OCX (exercises the cache-save path the abort fires in)
        id: setup
        uses: ./
        with:
          version: latest
          # Binary-only: project activation needs win-arm64 toolchain builds
          # that are out of scope for this regression test.
          project: ""
          cache-suffix: ${{ github.run_id }}
      - name: Verify binary works
        shell: bash
        run: ocx version
      - name: Verify project not activated (binary-only mode)
        shell: bash
        env:
          PROJECT_LOADED: ${{ steps.setup.outputs.project-loaded }}
        run: test "$PROJECT_LOADED" = "false"
