name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup OCX
        uses: ./

      - name: Generate release notes
        id: changelog
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md
        run: |
          git-cliff --latest --strip header --output "$OUTPUT"
          {
            echo 'content<<EOF'
            cat "$OUTPUT"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          make_latest: true

      - name: Update major version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major"
          git push origin "$major" --force
